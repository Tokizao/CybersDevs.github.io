<!DOCTYPE html>
<html lang="pt-BR">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>CybersDevs | Login</title>
        <meta name="description" content="Website de LOGIN & REGISTRO feito por Tokizão (EU) :3">

        <link rel="stylesheet" href="assets/css/pages/login.css">
        <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
    </head>
    <body>
        <div class="background"></div>
        <div class="background-blur"></div>
        <div class="page-loader"><div class="loader"></div></div>

        <main class="container">
            <header class="fixed-top">
                <h1>Cybers<span>Devs</span></h1>
            </header>

           <form>
                <div class="icons">
                    <a href="https://github.com/Tokizao" target="_blank" class="git-hub">
                        <i class="bi bi-github"></i>
                    </a>
                    <a href="" target="_blank" class="website">
                        <i class="bi bi-globe2"></i>
                    </a>
                </div>
                <div class="input-box">
                    <input placeholder="Usuário" type="email">
                    <i class="bi bi-person-fill"></i>
                </div>
                <div class="input-box">
                    <input placeholder="Senha" type="password">
                    <i class="bi bi-key-fill"></i>
                </div>

                <button class="login" type="submit">Login</button>

                <div class="questions-box">
                    <a class="forgot-text" href="#">Esqueci a Senha</a>
                    <a class="register-text" href="index.html">Cadastre-se</a>
                </div>
           </form>
        </main>

        <script src="/assets/js/loading.js" defer></script>
        <script src="/assets/js/background.js" defer></script>
    </body>
</html>
